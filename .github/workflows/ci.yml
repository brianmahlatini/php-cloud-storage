name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: phpstan, php-cs-fixer
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: "1"
      - run: phpstan analyse --no-progress
      - run: vendor/bin/phpunit --coverage-text --log-junit junit.xml
      - if: failure()
        run: python3 .github/scripts/junit-annotate.py junit.xml

  # Prove the signatures against real servers: SeaweedFS speaks the S3 API
  # (SigV4), Azurite is Microsoft's Blob Storage emulator (SAS).
  interop:
    needs: test
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ["10000:10000"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl
      - run: composer install --no-interaction --no-progress --no-dev
      - name: Start SeaweedFS (S3 API with SigV4 auth) and create a bucket
        env:
          AWS_ACCESS_KEY_ID: s3test
          AWS_SECRET_ACCESS_KEY: s3test-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          fail() { echo "::error title=seaweedfs::$1 $(tr '\n' '|' < /tmp/out | tail -c 1500)"; exit 1; }
          cat > /tmp/s3.json <<'JSON'
          {"identities":[{"name":"ci","credentials":[{"accessKey":"s3test","secretKey":"s3test-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name seaweedfs -p 8333:8333 -v /tmp/s3.json:/etc/s3.json:ro \
            chrislusf/seaweedfs server -s3 -s3.config=/etc/s3.json >/tmp/out 2>&1 || fail "docker run failed:"
          for _ in $(seq 1 60); do aws --endpoint-url http://127.0.0.1:8333 s3 ls >/tmp/out 2>&1 && break; sleep 2; done
          aws --endpoint-url http://127.0.0.1:8333 s3 mb s3://roundtrip-bucket >/tmp/out 2>&1 \
            || { docker logs --tail 40 seaweedfs >>/tmp/out 2>&1; fail "bucket creation failed:"; }
      - name: Create Azurite container
        run: az storage container create --name roundtrip --connection-string "UseDevelopmentStorage=true;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1"
      - run: php examples/roundtrip.php s3
      - run: php examples/roundtrip.php azure
