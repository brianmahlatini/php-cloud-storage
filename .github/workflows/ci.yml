name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: phpstan, php-cs-fixer
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: "1"
      - run: phpstan analyse --no-progress
      - run: vendor/bin/phpunit --coverage-text --log-junit junit.xml
      - if: failure()
        run: python3 .github/scripts/junit-annotate.py junit.xml

  # Prove the signatures against real servers: MinIO speaks the S3 API
  # (SigV4), Azurite is Microsoft's Blob Storage emulator (SAS).
  interop:
    needs: test
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ["10000:10000"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl
      - run: composer install --no-interaction --no-progress --no-dev
      - name: Start MinIO and create a bucket
        run: |
          set -o pipefail
          fail() { echo "::error title=minio::$1 $(tr '\n' '|' < /tmp/out | tail -c 1500)"; exit 1; }
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data >/tmp/out 2>&1 || fail "docker run failed:"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker logs minio >/tmp/out 2>&1 || true
          docker run --rm --network host --entrypoint sh quay.io/minio/mc -c \
            "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/roundtrip-bucket" >/tmp/out 2>&1 \
            || fail "bucket creation failed:"
      - name: Create Azurite container
        run: az storage container create --name roundtrip --connection-string "UseDevelopmentStorage=true;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1"
      - run: php examples/roundtrip.php s3
      - run: php examples/roundtrip.php azure
